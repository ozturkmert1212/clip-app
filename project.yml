name: ClipApp
options:
  bundleIdPrefix: com.mertozturk
  deploymentTarget:
    macOS: "13.0"
  createIntermediateGroups: true
  developmentLanguage: en
  knownRegions: [en, tr]
packages:
  KeyboardShortcuts:
    url: https://github.com/sindresorhus/KeyboardShortcuts
    from: 2.0.0
  Sparkle:
    url: https://github.com/sparkle-project/Sparkle
    from: 2.10.0
settings:
  base:
    SWIFT_VERSION: "5.0"
    SWIFT_EMIT_LOC_STRINGS: YES
    LOCALIZATION_PREFERS_STRING_CATALOGS: YES
    MARKETING_VERSION: "0.3.1"
    CURRENT_PROJECT_VERSION: "6"
targets:
  ClipApp:
    type: application
    platform: macOS
    sources:
      - ClipApp
    dependencies:
      - package: KeyboardShortcuts
      - package: Sparkle
    info:
      path: ClipApp/Info.plist
      properties:
        CFBundleDisplayName: ClipApp
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CFBundleDevelopmentRegion: en
        CFBundleLocalizations: [en, tr]
        LSUIElement: true
        LSApplicationCategoryType: public.app-category.utilities
        NSMicrophoneUsageDescription: ClipApp uses the microphone to add your voice to your clips.
        # Sparkle: a daily check, an update is offered and never installed
        # without asking, and nothing about the Mac is sent.
        SUFeedURL: https://ozturkmert1212.github.io/clip-app/appcast.xml
        SUPublicEDKey: zlSR5pJy/YB7Tg+/JYPu8RG90jEzitDbt7PpO+5smuI=
        SUEnableAutomaticChecks: true
        SUScheduledCheckInterval: 86400
        SUAutomaticallyUpdate: false
        SUAllowsAutomaticUpdates: false
        SUEnableSystemProfiling: false
    entitlements:
      path: ClipApp/ClipApp.entitlements
      properties:
        com.apple.security.app-sandbox: false
        com.apple.security.device.audio-input: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.mertozturk.ClipApp
        # Apple Silicon only; a Release build would otherwise be universal.
        ARCHS: arm64
        DEVELOPMENT_TEAM: CRHSYX58TX
        CODE_SIGN_STYLE: Automatic
        CODE_SIGN_IDENTITY: "Apple Development"
        ENABLE_HARDENED_RUNTIME: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
    scheme:
      testTargets:
        - ClipAppTests
  # Not hosted by the app: launching ClipApp would start screen capture. The
  # tests compile the parts they exercise, none of which touches the screen,
  # a permission or a device.
  ClipAppTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - ClipAppTests
      - ClipApp/Buffer
      - ClipApp/Capture/CapturePrivacy.swift
      - ClipApp/Clip
      - ClipApp/Encoding
      - ClipApp/Library/ClipCatalog.swift
      - ClipApp/Library/ClipEditing.swift
      - ClipApp/Library/ClipInfo.swift
      - ClipApp/Library/ClipTrimmer.swift
      - ClipApp/Settings/AppLanguage.swift
      - ClipApp/App/GameContext.swift
      - ClipApp/App/CaptureActivity.swift
      - ClipApp/App/UpdateReminder.swift
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.mertozturk.ClipAppTests
        GENERATE_INFOPLIST_FILE: YES
        CODE_SIGN_STYLE: Manual
        CODE_SIGN_IDENTITY: "-"
        SWIFT_EMIT_LOC_STRINGS: NO
